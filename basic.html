<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki Scroll</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column;
    background: #fff; color: #202122;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: #36c; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .serif { font-family: "Linux Libertine", "Georgia", "Times", serif; font-weight: normal; }

  header {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 16px;
    border-bottom: 1px solid #a2a9b1;
  }
  header .name { font-size: 22px; }
  header a { font-size: 14px; }

  .page { max-width: 640px; width: 100%; margin: 0 auto; padding: 0 16px; }
  h1 { font-size: 28px; line-height: 1.3; border-bottom: 1px solid #a2a9b1; padding-bottom: 4px; margin-bottom: 4px; }
  h2 { font-size: 16px; font-weight: bold; margin: 24px 0 8px; }
  .small { font-size: 14px; color: #54595d; }

  button {
    font: inherit; font-weight: bold; font-size: 14px;
    color: #fff; background: #36c;
    border: 1px solid #36c; border-radius: 2px;
    padding: 6px 14px; cursor: pointer;
  }
  button:disabled { background: #c8ccd1; border-color: #c8ccd1; cursor: default; }
  button.quiet { color: #202122; background: #f8f9fa; border-color: #a2a9b1; }

  /* Quiz */
  #quiz { padding-top: 32px; padding-bottom: 32px; overflow-y: auto; }
  #add { display: flex; gap: 8px; margin: 16px 0 12px; }
  #add input {
    flex: 1; font: inherit; padding: 5px 8px;
    border: 1px solid #a2a9b1; border-radius: 2px;
  }
  #bubbles { display: flex; flex-wrap: wrap; gap: 8px; }
  .bubble {
    font: inherit; font-size: 14px; font-weight: normal;
    color: #202122; background: #fff;
    border: 1px solid #a2a9b1; border-radius: 999px;
    padding: 5px 14px;
  }
  .bubble.on { color: #36c; background: #eaf3ff; border-color: #36c; }
  #ratio { width: 100%; }
  #go { margin-top: 24px; }

  /* Feed: a pager that moves exactly one article per swipe, like Shorts/TikTok. */
  #feed { flex: 1; position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #track { will-change: transform; }
  #track.animate { transition: transform 320ms cubic-bezier(.22, .8, .3, 1); }
  .card {
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
  }
  .card a.text { color: inherit; display: block; }
  .card a.text:hover { text-decoration: none; }
  .card a.text:hover h1 { color: #36c; }
  .card .small { margin-bottom: 16px; }
  .card .more { margin-top: 16px; font-size: 14px; }
  .status { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; color: #54595d; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <span class="name serif">Wiki Scroll</span>
  <a href="#" id="change" hidden>Change interests</a>
</header>

<section id="quiz" class="page" hidden>
  <h1 class="serif">Your interests</h1>
  <p class="small">Tap the ones you like, or add your own. Anything Wikipedia covers works.</p>

  <form id="add">
    <input id="custom" placeholder="Add an interest, e.g. Cherenkov radiation" autocomplete="off">
    <button class="quiet">Add</button>
  </form>
  <div id="bubbles"></div>

  <h2>Wildcard ratio</h2>
  <p class="small" id="ratioLabel"></p>
  <input type="range" id="ratio" min="0" max="100" step="10" value="20">

  <button id="go" disabled>Start reading</button>
</section>

<main id="feed" hidden><div id="track"></div></main>

<script>
  const SUGGESTED = [
    "Classic Hollywood", "World War II", "U.S. presidents", "Cherenkov radiation", "Early internet",
    "Ancient Rome", "Cold War", "Space exploration", "Deep sea creatures", "Shipwrecks",
    "Volcanoes", "Medieval castles", "Jazz", "Mythology", "Dinosaurs",
    "Lost cities", "Famous heists", "Inventions", "Board games", "Typography",
  ];

  const $ = id => document.getElementById(id);
  const quiz = $("quiz"), bubbles = $("bubbles"), custom = $("custom"), ratio = $("ratio");
  const feed = $("feed"), track = $("track"), change = $("change"), go = $("go");

  // ---------- Saved preferences (this browser only) ----------

  function loadPrefs() {
    try {
      const p = JSON.parse(localStorage.getItem("prefs"));
      if (p && Array.isArray(p.interests)) return p;
    } catch {}
    return { interests: [], wildcard: 0.2 };
  }
  function savePrefs(p) {
    try { localStorage.setItem("prefs", JSON.stringify(p)); } catch {}
  }

  // ---------- Quiz ----------

  let chosen = new Set();

  function renderBubbles() {
    const names = [...chosen].filter(n => !SUGGESTED.includes(n)).concat(SUGGESTED);
    bubbles.replaceChildren(...names.map(name => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "bubble" + (chosen.has(name) ? " on" : "");
      b.textContent = name;
      b.onclick = () => {
        chosen.has(name) ? chosen.delete(name) : chosen.add(name);
        renderBubbles();
      };
      return b;
    }));
    go.disabled = chosen.size === 0;
  }

  $("add").addEventListener("submit", e => {
    e.preventDefault();
    const name = custom.value.trim();
    if (!name) return;
    const existing = [...chosen, ...SUGGESTED].find(n => n.toLowerCase() === name.toLowerCase());
    chosen.add(existing || name);
    custom.value = "";
    renderBubbles();
  });

  function renderRatio() {
    const n = ratio.value / 10;
    $("ratioLabel").textContent = n === 0
      ? "No wildcards. Only your interests."
      : `${n} in 10 articles will be something random, outside your interests.`;
  }
  ratio.addEventListener("input", renderRatio);

  function showQuiz() {
    const prefs = loadPrefs();
    chosen = new Set(prefs.interests);
    ratio.value = Math.round(prefs.wildcard * 100);
    renderBubbles();
    renderRatio();
    feed.hidden = true;
    change.hidden = true;
    quiz.hidden = false;
  }

  go.addEventListener("click", () => {
    const prefs = { interests: [...chosen], wildcard: ratio.value / 100 };
    savePrefs(prefs);
    startFeed(prefs);
  });

  change.addEventListener("click", e => {
    e.preventDefault();
    showQuiz();
  });

  // ---------- Articles from Wikipedia ----------

  const API = "https://en.wikipedia.org/w/api.php?";
  const BASE = {
    action: "query", format: "json", formatversion: 2, origin: "*",
    prop: "extracts|info", exintro: 1, explaintext: 1, exsentences: 4, exlimit: 20, inprop: "url",
  };

  async function fetchPages(params) {
    const res = await fetch(API + new URLSearchParams({ ...BASE, ...params }));
    if (!res.ok) throw new Error("Wikipedia returned " + res.status);
    const data = await res.json();
    const pages = (data.query && data.query.pages) || [];
    // Search results come back unordered; `index` is the relevance rank.
    pages.sort((a, b) => (a.index || 0) - (b.index || 0));
    return { pages, more: data.continue };
  }

  const usable = p => p.extract && p.extract.length > 80 && !/may refer to/.test(p.extract);

  let sources, wildcards, wildcardRatio, seen;

  function makeSources(interests) {
    return interests.map(name => ({ name, pool: [], offset: 0, done: false }));
  }

  async function refill(src) {
    const { pages, more } = await fetchPages({
      generator: "search", gsrnamespace: 0, gsrlimit: 20, gsroffset: src.offset, gsrsearch: src.name,
    });
    src.pool.push(...pages.filter(usable));
    if (more && more.gsroffset) src.offset = more.gsroffset; else src.done = true;
  }

  async function refillWildcards() {
    const { pages } = await fetchPages({ generator: "random", grnnamespace: 0, grnlimit: 20 });
    wildcards.push(...pages.filter(usable));
  }

  // Picks the next article: a wildcard at the chosen ratio, otherwise one of your interests.
  async function nextArticle() {
    for (let tries = 0; tries < 20; tries++) {
      const live = sources.filter(s => !s.done || s.pool.length);
      if (Math.random() < wildcardRatio || live.length === 0) {
        if (!wildcards.length) await refillWildcards();
        const p = wildcards.shift();
        if (p && !seen.has(p.pageid)) return { page: p, label: "Wildcard" };
      } else {
        const src = live[Math.floor(Math.random() * live.length)];
        if (!src.pool.length) await refill(src);
        const p = src.pool.shift();
        if (p && !seen.has(p.pageid)) return { page: p, label: src.name };
      }
    }
    throw new Error("Ran out of articles");
  }

  // ---------- Feed ----------

  const AHEAD = 4;        // keep this many articles ready past the current one
  let cards, index, height, filling;
  const status = document.createElement("div");
  status.className = "status";

  function startFeed(prefs) {
    sources = makeSources(prefs.interests);
    wildcards = [];
    wildcardRatio = prefs.wildcard;
    seen = new Set();
    cards = [];
    index = 0;
    track.replaceChildren(status);
    quiz.hidden = true;
    feed.hidden = false;
    change.hidden = false;
    layout(false);
    topUp();
  }

  function card({ page, label }) {
    const el = document.createElement("article");
    el.className = "card page";

    const text = document.createElement("a");
    text.className = "text";
    text.href = page.fullurl;
    text.target = "_blank";
    text.rel = "noopener";

    const h = document.createElement("h1");
    h.className = "serif";
    h.textContent = page.title;
    const from = document.createElement("div");
    from.className = "small";
    from.textContent = "From Wikipedia, the free encyclopedia · " + label;
    const p = document.createElement("p");
    p.textContent = page.extract;
    text.append(h, from, p);

    const more = document.createElement("a");
    more.className = "more";
    more.href = page.fullurl;
    more.target = "_blank";
    more.rel = "noopener";
    more.textContent = "Read the full article";

    el.append(text, more);
    el.style.height = height + "px";
    return el;
  }

  function showStatus(message, retry) {
    status.replaceChildren(message);
    if (retry) {
      const b = document.createElement("button");
      b.className = "quiet";
      b.textContent = "Try again";
      b.onclick = topUp;
      status.append(b);
    }
  }

  async function topUp() {
    if (filling) return;
    filling = true;
    showStatus("Loading…");
    try {
      while (cards.length - index <= AHEAD) {
        const a = await nextArticle();
        seen.add(a.page.pageid);
        const el = card(a);
        track.insertBefore(el, status);
        cards.push(el);
      }
    } catch (e) {
      showStatus("Couldn't load articles from Wikipedia (" + e.message + ").", true);
    }
    filling = false;
  }

  // Positions the track so the current card fills the feed.
  function layout(animate, dragOffset = 0) {
    height = feed.clientHeight;
    for (const el of track.children) el.style.height = height + "px";
    track.classList.toggle("animate", animate);
    track.style.transform = `translate3d(0, ${-index * height + dragOffset}px, 0)`;
  }

  function goTo(i) {
    index = Math.max(0, Math.min(i, cards.length));   // cards.length = the loading/status card
    layout(true);
    topUp();
  }

  window.addEventListener("resize", () => { if (!feed.hidden) layout(false); });

  // Touch: the card follows your finger, then snaps to the next one on a
  // short flick or a drag past 20% of the screen, otherwise springs back.
  let drag = null, dragged = false;
  feed.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse") return;
    drag = { y: e.clientY, t: e.timeStamp, samples: [[e.timeStamp, e.clientY]] };
    dragged = false;
  });
  feed.addEventListener("pointermove", e => {
    if (!drag) return;
    let dy = e.clientY - drag.y;
    if (Math.abs(dy) > 8) dragged = true;
    if ((index === 0 && dy > 0) || (index === cards.length && dy < 0)) dy *= 0.3;  // resist at the ends
    drag.samples.push([e.timeStamp, e.clientY]);
    if (drag.samples.length > 5) drag.samples.shift();
    layout(false, dy);
  });
  function endDrag(e) {
    if (!drag) return;
    const dy = e.clientY - drag.y;
    const [t0, y0] = drag.samples[0];
    const velocity = (e.clientY - y0) / Math.max(1, e.timeStamp - t0);  // px per ms
    drag = null;
    if (dy < -height * 0.2 || velocity < -0.35) goTo(index + 1);
    else if (dy > height * 0.2 || velocity > 0.35) goTo(index - 1);
    else layout(true);
  }
  feed.addEventListener("pointerup", endDrag);
  feed.addEventListener("pointercancel", endDrag);

  // A drag shouldn't count as a tap on the article text.
  feed.addEventListener("click", e => {
    if (dragged) { e.preventDefault(); dragged = false; }
  }, true);

  // Mouse wheel / trackpad: one article per gesture. Momentum from the same
  // gesture is ignored until the wheel goes quiet.
  let wheelSum = 0, wheelLocked = false, wheelTimer;
  feed.addEventListener("wheel", e => {
    e.preventDefault();
    clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => { wheelLocked = false; wheelSum = 0; }, 160);
    if (wheelLocked) return;
    wheelSum += e.deltaY;
    if (Math.abs(wheelSum) > 30) {
      goTo(index + Math.sign(wheelSum));
      wheelLocked = true;
    }
  }, { passive: false });

  document.addEventListener("keydown", e => {
    if (feed.hidden) return;
    if (["ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); goTo(index + 1); }
    if (["ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); goTo(index - 1); }
  });

  // ---------- Start ----------

  const prefs = loadPrefs();
  if (prefs.interests.length) startFeed(prefs); else showQuiz();
</script>
</body>
</html>
